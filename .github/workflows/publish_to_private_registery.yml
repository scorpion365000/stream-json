name: Trigger Deployment

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  trigger_deploy:
    if: github.actor != 'deployer-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build app_info and trigger deployment
        env:
          REPO_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          TRIGGER_USER_PASSWORD: ${{ secrets.TRIGGER_USER_PASSWORD }}
          DEPLOYER_WEBHOOK_URL: ${{ vars.DEPLOYER_WEBHOOK_URL }}
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const userPassword = process.env.TRIGGER_USER_PASSWORD;
          const webhookUrl = process.env.DEPLOYER_WEBHOOK_URL;

          if (!userPassword) {
            throw new Error("TRIGGER_USER_PASSWORD not found");
          }

          if (!webhookUrl) {
            throw new Error("DEPLOYER_WEBHOOK_URL not found");
          }

          const appInfo = {
            COMMIT_SHA: process.env.COMMIT_SHA,
            IS_NPM_PACKAGE: true,
            REPO_NAME: process.env.REPO_NAME,
            ENV: {}
          };

          const payload = {
            app_info: appInfo
          };

          fs.writeFileSync(
            "app_info.json",
            JSON.stringify(payload, null, 2)
          );
          NODE

          echo "Generated payload:"
          cat app_info.json

          curl \
            --fail-with-body \
            --show-error \
            --verbose \
            -X POST "${DEPLOYER_WEBHOOK_URL}/trigger_scan" \
            -H "Content-Type: application/json" \
            -H "user-password: ${TRIGGER_USER_PASSWORD}" \
            --data-binary @app_info.json

      - name: Wait for deployment result
        env:
          COMMIT_SHA: ${{ github.sha }}
          TRIGGER_USER_PASSWORD: ${{ secrets.TRIGGER_USER_PASSWORD }}
          DEPLOYER_WEBHOOK_URL: ${{ vars.DEPLOYER_WEBHOOK_URL }}
        run: |

          while true; do

            RESPONSE=$(
              curl -s \
                -X POST "${DEPLOYER_WEBHOOK_URL}/check_feedback" \
                -H "Content-Type: application/json" \
                -H "user-password: ${TRIGGER_USER_PASSWORD}" \
                -d "{\"commit_sha\":\"${COMMIT_SHA}\"}"
            )

            echo "$RESPONSE"

            ERROR=$(echo "$RESPONSE" | jq -r '.error // empty')
            SUCCESS=$(echo "$RESPONSE" | jq -r '.success // empty')

            if [ -n "$ERROR" ]; then
              echo "❌ $ERROR"
              exit 1
            fi

            if [ -n "$SUCCESS" ]; then
              echo "✅ $SUCCESS"
              exit 0
            fi

            sleep 3

          done
