version: 2

# Paths and files to ignore during scan
projectIgnorePaths:
  - "node_modules"
  - "dist"
  - "build"
  - ".git"
  - ".github"
  - "coverage"
  - "*.log"

# Only trigger alerts when these files change
triggerPaths:
  - "package.json"
  -  "package-lock.json"
issueRules:
  unresolvedRequire: false    # don’t block PRs for unresolved requires

githubApp:
  enabled: true
  dependencyOverviewEnabled: true
  # No ignoreUsers → applies to all users
  disableCommentsAndCheckRuns: false
